[package]
name = "rust_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
garaga_rs = { git = "https://github.com/keep-starknet-strange/garaga", tag = "v0.18.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starknet-types-core = "0.2"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
log = "0.4"
android_logger = "0.13"

[patch.crates-io]
size-of = { path = "../patches/size-of" }
